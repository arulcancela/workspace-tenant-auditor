name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint (ruff) + Tests (pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint con ruff
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Ejecutar tests con cobertura
        run: pytest --cov=src/tenant_auditor --cov-report=xml --cov-report=term-missing

      - name: Subir informe de cobertura
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  demo-smoke-test:
    name: Smoke test del modo demo (sin credenciales)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Ejecutar auditoría en modo demo
        run: |
          tenant-auditor audit --dry-run --domain ejemplo.com --output ./reports --formats html,json || true
          test -n "$(ls reports/*.html)" && echo "Informe HTML generado correctamente"
          test -n "$(ls reports/*.json)" && echo "Informe JSON generado correctamente"
      - name: Subir informe demo
        uses: actions/upload-artifact@v4
        with:
          name: demo-report
          path: reports/
